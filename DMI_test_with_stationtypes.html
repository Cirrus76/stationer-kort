var typeLayers = {};

function getLayer(type) {
    if(!typeLayers[type]) {
        typeLayers[type] = L.layerGroup().addTo(map);
    }
    return typeLayers[type];
}

function buildMarkers(data) {
    Object.values(typeLayers).forEach(l => l.clearLayers());

    var markerIndex = [];

    data.forEach(function(station){
        var layer = getLayer(station.report_type);

        var popup =
            "<b>Stationsnr.:</b> " + (station.statid || "") + "<br>" +
            "<b>Stationsnavn:</b> " + (station.name || "") + "<br>" +
            "<b>Startdato:</b> " + (station.start_time || "") + "<br>" +
            "<b>Slutdato:</b> " + (station.end_time || "") + "<br>" +
            "<b>Breddegrad:</b> " + station.lat + "<br>" +
            "<b>Længdegrad:</b> " + station.long + "<br>" +
            "<b>Højde over havet:</b> " + (station.height || "") + " m<br>" +
            "<b>Stationstype:</b> " + (station.report_type || "");

        var marker = L.marker([station.lat, station.long]).bindPopup(popup);
        marker.addTo(layer);

        markerIndex.push({
            text: ((station.statid || "") + " " + (station.name || "")).toLowerCase(),
            marker: marker,
            layer: layer
        });
    });

    document.getElementById("stationCount").innerText = data.length;

    document.getElementById("searchInput").oninput = function() {
        var query = this.value.toLowerCase();
        markerIndex.forEach(function(entry){
            if(entry.text.includes(query)) {
                entry.layer.addLayer(entry.marker);
            } else {
                entry.layer.removeLayer(entry.marker);
            }
        });
    };
}

function applyFilter() {
    var selectedYear = parseInt(document.getElementById("yearSlider").value);
    var activeOnly = document.getElementById("activeOnly").checked;

    var filtered = stationData.filter(function(station){
        var startYear = parseInt((station.start_time || "").substring(0,4));
        var endYear = parseInt((station.end_time || "").substring(0,4));

        if(isNaN(startYear)) return false;
        if(isNaN(endYear)) endYear = 9999;

        if(activeOnly && endYear < new Date().getFullYear()) return false;

        return selectedYear >= startYear && selectedYear <= endYear;
    });

    buildMarkers(filtered);
}

document.getElementById("yearSlider").addEventListener("input", function(){
    document.getElementById("yearValue").innerText = this.value;
    applyFilter();
});

document.getElementById("activeOnly").addEventListener("change", applyFilter);

applyFilter();

var baseLayers = {
    "OpenStreetMap": osm,
    "Satellit": satellite,
    "Gråskala": grayscale
};

L.control.layers(baseLayers, typeLayers, {collapsed:false, position:'topright'}).addTo(map);
